services:
  - type: web
    name: prime-hax-social
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: verify-full
      - key: DATABASE_CA_CERT_PATH
        value: ./certs/supabase-ca.crt
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: INVITE_CODE_PEPPER
        sync: false
      - key: RECOVERY_CODE_PEPPER
        sync: false
